appId: org.calmatters.airplane-mode-gui
productName: Airplane Mode
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - build/**
  - drizzle/**
  - resources/icon.png
  - package.json
  # The marketing website (www/) is deployed separately and never goes in the app
  - '!www/**'
mac:
  target: dmg
  category: public.app-category.productivity
  # Without a paid Apple Developer ID the app is "ad-hoc" signed: a valid signature with no
  # identity. macOS then blocks the downloaded app as being from an unidentified developer
  # (open it via System Settings > Privacy & Security > Open Anyway) instead of calling it damaged.
  # To sign and notarize for real, delete `identity` below and see the README.
  identity: '-'
  hardenedRuntime: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  # Installer file names leave out the version, so the website can link to the newest GitHub release's
  # files (releases/latest/download/<name>), and use no spaces, which GitHub turns into dots
  artifactName: Airplane-Mode-mac-${arch}.${ext}
win:
  target: nsis
nsis:
  artifactName: Airplane-Mode-windows-${arch}-setup.${ext}
linux:
  target: AppImage
  artifactName: Airplane-Mode-linux-${arch}.${ext}
